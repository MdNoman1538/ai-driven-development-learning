name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install (exact locked versions)
        run: npm ci
      # Every dependency and ADR of every project must be explained (ADR-0003).
      - name: Coverage check
        run: npm run coverage
      - name: Type check
        run: npx astro check
      - name: Build
        run: npm run build
